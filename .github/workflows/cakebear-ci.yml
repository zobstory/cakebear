name: cakebear-ci

# -----------------------------------------------------------------------------
# cakebear's own gates. Upstream's ci.yml is a separate, inherited workflow --
# leave it alone; it is an upstream file (see scripts/owned-paths).
#
# Everything here is scoped to the paths cakebear owns. Upstream's tree is
# ~4800 Go files, so an unscoped coverage or line-limit gate would be measuring
# Microsoft's code and telling us nothing about ours.
#
# To require these before merge:
#   Settings -> Branches -> add a rule on `main` requiring
#     golden-rule, line-limit, build, test, lint
# -----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  # Also verify main after a merge. A PR gate only proves each change was good
  # in isolation; it says nothing about the result of combining two that were
  # each green separately, or about a merge resolved by hand.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-rule:
    name: golden-rule (no upstream files touched)
    runs-on: ubuntu-latest
    # Only meaningful on a pull request: on a push to main the diff against
    # main is empty, so the check would pass without examining anything.
    #
    # Upstream syncs necessarily touch upstream files. cakebear-sync-upstream.yml
    # labels those PRs so this gate steps aside for them, and only for them.
    if: >-
      ${{ github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream for comparison
        # The check asks whether upstream actually has each changed file, so it
        # needs the ref. Without it the check still runs, against the manifest
        # alone, and says so.
        run: |
          git remote add upstream https://github.com/microsoft/typescript-go.git || true
          git fetch --no-tags --depth=1 upstream main:refs/remotes/upstream/main
      - name: Check no upstream file was modified
        run: scripts/check-upstream-untouched.sh origin/${{ github.base_ref || 'main' }}

  boundary:
    name: boundary (ir/ and backend/ stay extractable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/check-boundary.sh

  line-limit:
    name: line-limit (<= 500 lines per owned .go file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-line-limit.py
      # A malformed workflow fails as a run with zero jobs and no message,
      # which is a slow way to find a typo. Catch it here instead.
      - run: scripts/check-workflows.sh

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...

  test:
    name: test (coverage >= 70%, goal 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test cakebear packages with coverage
        # The 70% floor is the merge gate; 80% is the target. When most owned
        # packages are past 80%, raise FLOOR and delete this comment.
        run: |
          set -euo pipefail
          FLOOR=70
          pkgs=$(scripts/owned-go-packages.sh)
          if [ -z "$pkgs" ]; then
            echo "No cakebear-owned packages yet — nothing to cover."
            exit 0
          fi
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test -covermode=atomic -coverprofile=cover.out $pkgs
          go tool cover -func=cover.out | tail -1
          total=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          awk -v t="$total" -v f="$FLOOR" 'BEGIN {
            if (t + 0 < f) { printf "::error::line coverage %.1f%% is below the %d%% floor\n", t, f; exit 1 }
            printf "coverage %.1f%% (floor %d%%)\n", t, f
          }'

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve owned packages
        id: pkgs
        run: |
          set -euo pipefail
          pkgs=$(scripts/owned-go-packages.sh)
          echo "empty=$([ -z "$pkgs" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      - name: golangci-lint
        if: steps.pkgs.outputs.empty == 'false'
        uses: golangci/golangci-lint-action@v6
        with:
          # Config is upstream's .golangci.yml, inherited by the fork.
          args: --timeout=10m ./cmd/cakec/... ./ir/... ./backend/... ./runtime/... ./types/...
      - name: Skip
        if: steps.pkgs.outputs.empty == 'true'
        run: echo "No cakebear-owned packages yet — nothing to lint."
