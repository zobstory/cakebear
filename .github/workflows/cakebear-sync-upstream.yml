name: cakebear-sync-upstream

# -----------------------------------------------------------------------------
# Snapshot microsoft/TypeScript's tsc/ into cakebear once a week and open a PR.
#
# The cadence is the point. A fork that syncs weekly meets upstream's API
# changes a few at a time; one that syncs after six months meets them all at
# once and eventually gets abandoned instead. Finding out on a Monday that a
# sync breaks cakebear's own code is the cheapest version of that news.
#
# Upstream was microsoft/typescript-go until it was archived on 2026-08-20 and
# moved into microsoft/TypeScript under tsc/. scripts/sync-upstream.sh explains
# why a sync is now a snapshot rather than a merge.
# -----------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/microsoft/TypeScript.git

jobs:
  sync:
    name: snapshot upstream main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config user.name  "cakebear-sync[bot]"
          git config user.email "cakebear-sync@users.noreply.github.com"

      - name: Find upstream's latest commit
        id: check
        run: |
          set -euo pipefail
          latest=$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)
          current=$(tr -d '[:space:]' <scripts/upstream-ref)
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "up-to-date=true" >>"$GITHUB_OUTPUT"
            echo "Already at microsoft/TypeScript@${latest:0:9}; nothing to do."
          else
            echo "up-to-date=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Snapshot and rewrite module path
        if: steps.check.outputs.up-to-date == 'false'
        id: sync
        run: |
          set -euo pipefail
          branch="sync/upstream-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          before=$(git rev-parse HEAD)
          scripts/sync-upstream.sh "${{ steps.check.outputs.latest }}"
          # Most monorepo commits don't touch tsc/: then the script commits
          # nothing, and there is no PR to open.
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force-with-lease origin "$branch"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          # cakebear-ci.yml checks a PR with this label against the snapshot
          # instead of against "touches no upstream file".
          gh label create upstream-sync \
            --color 0E8A16 \
            --description "Snapshots microsoft/TypeScript's tsc/; checked against the snapshot" \
            2>/dev/null || true
          gh pr create \
            --base main \
            --head "${{ steps.sync.outputs.branch }}" \
            --label upstream-sync \
            --title "Sync upstream to microsoft/TypeScript@${SHA:0:9} (tsc/)" \
            --body-file .github/upstream-sync-pr-body.md

      - name: Report
        if: steps.check.outputs.up-to-date == 'true' || steps.sync.outputs.changed == 'false'
        run: echo "cakebear's upstream tree is level with microsoft/TypeScript main."
