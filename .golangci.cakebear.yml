# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

# Lint configuration for cakebear's own packages.
#
# Upstream's .golangci.yml lives at the root of microsoft/TypeScript, outside
# the tsc/ tree cakebear syncs, so it is not in this repo at all. It would not
# work here anyway: it enables `customlint`, a plugin that only exists in a
# golangci-lint binary built from their .custom-gcl.yml. The stock binary the
# CI action installs has no such linter, so pointing at their config fails
# before it lints a single file -- which is exactly what happened on the first
# real CI run.
#
# The enabled set is upstream's (as of microsoft/TypeScript@aa8149273), minus:
#   - customlint: conventions internal to the TypeScript port.
#   - depguard and forbidigo: their import graph and host abstraction. forbidigo
#     bans os and path/filepath outside their host packages, but backend/ is
#     required to import only the standard library.
#   - modernize: available in the pinned v2.14.0 but not yet enabled. It flags
#     six sites in owned code; turning it on is its own change, not part of a
#     sync.
# Same standards, our code.

version: '2'

run:
  allow-parallel-runners: true

issues:
  # Report every finding rather than a sample. The defaults cap repeats per
  # linter, which turns one clean-up into several fix-and-rerun rounds.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - goprintffuncname
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    # `modernize` is upstream's; see the header for why it is off.
    - musttag
    - nakedret
    - nolintlint
    - paralleltest
    - perfsprint
    - predeclared
    - reassign
    - testableexamples
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting

  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
